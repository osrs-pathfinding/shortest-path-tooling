plugins {
    id 'java'
}

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content { includeGroupByRegex('net\\.runelite.*') }
    }
    mavenCentral()
}

def runeLiteVersion = '1.12.39'

dependencies {
    implementation "net.runelite:runelite-api:$runeLiteVersion"
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'junit:junit:4.13.2'
}

group = 'shortestpath.corpus'
version = '1.0'

java {
    toolchain { languageVersion.set(JavaLanguageVersion.of(11)) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

tasks.register('generateAccountProfiles', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'shortestpath.corpus.profiles.Main'
    args 'generate', new File(projectDir, '../accounts/account-profiles-v1.json').path
}

tasks.register('verifyAccountProfiles', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'shortestpath.corpus.profiles.Main'
    args 'verify', new File(projectDir, '../accounts/account-profiles-v1.json').path
}

test { useJUnit() }
