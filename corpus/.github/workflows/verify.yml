name: Verify corpus

on:
  push:
  pull_request:

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - run: gradle -p profile-generator test generateAccountProfiles verifyAccountProfiles
      - run: tools/format-json.sh --check accounts/account-profiles-v1.json
      - run: node tools/validate.js
