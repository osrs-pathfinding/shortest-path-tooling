name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Compile (Java 11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile test sources
        run: ./gradlew compileTestJava --stacktrace
        shell: bash

      - name: Check the account profiles and corpus data
        # Tests the Java profile definitions, checks corpus/ against them byte for byte,
        # and validates the presets against corpus/schemas.
        run: ./gradlew :accounts:check --stacktrace
        shell: bash

      - name: Check the scenario suites
        # Loads every suite (Java and route data), compiles the Java suites' accounts, and
        # tests the runner's frontends and the CLI.
        run: >-
          ./gradlew :test --stacktrace
          --tests 'shortestpath.scenarios.*'
          --tests 'shortestpath.benchmark.*' --tests 'shortestpath.route.*'
          --tests 'shortestpath.dashboard.ConfigParityTest'
        shell: bash

      - name: Test the routing module and the route service
        # Profiles, account builds, route policies and plans, then the service's HTTP layer on top.
        run: ./gradlew :routing:test :service:test --stacktrace
        shell: bash

  web:
    name: Web frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        # pretest generates the contracts from corpus/.
        run: npm test

      - name: Type-check and build
        run: npm run build

  validate:
    name: Validate data + Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          # The validate leaf checks enumerate committed plugin data via
          # git -C shortest-path ls-files — an empty submodule dir breaks them.
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run Python test suite
        run: python3 -m pytest tests/ -x

      - name: Validate committed data
        # Deterministic checks only — freshness needs the upstream
        # remote plus network, drift needs a local cache/, and verify
        # runs the Gradle dashboard sweep; all stay local-only.
        run: python3 scripts/maintenance.py validate --skip-freshness
