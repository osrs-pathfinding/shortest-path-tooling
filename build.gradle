plugins {
    id 'java'
    id 'checkstyle'
}

dependencies {
    // Plugin main sources via composite build (shortest-path is included in settings.gradle)
    testImplementation 'shortestpath:shortest-path'
    testImplementation project(':routing')

    // RuneLite: the client comes with :routing; the cache dumpers also need these.
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
    testImplementation(group: 'net.runelite', name: 'cache', version: runeLiteVersion) {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

// Every Java project in this build targets Java 11, like the plugin.
allprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(11)
    }
}

tasks.withType(Checkstyle).configureEach {
    enabled = false
}

// DashboardTest runs its full scenario suite under `test` too — give the
// test JVM the same heap the dedicated `dashboard` task provides.
test {
    jvmArgs = ['-Xms1g', '-Xmx8g']
    // Opt-in cache probes run via `test --tests ... -D<key>=...` — Gradle
    // does not forward -D to the forked test JVM, so pass the probe keys
    // through explicitly.
    ['tile.probe', 'tile.probe.box', 'tile.probe.boxes', 'tile.probe.plane',
     'tile.probe.ids', 'tile.probe.defids', 'tile.probe.vars', 'tile.probe.scripts', 'tile.probe.strings', 'tile.probe.iops',
     'tile.probe.cacheDir', 'tile.probe.xteaPath',
     'poh.loc.probe', 'poh.loc.probe.cacheDir', 'poh.loc.probe.xteaPath'].each { k ->
        if (System.getProperty(k) != null) {
            systemProperty k, System.getProperty(k)
        }
    }
}

// ConfigParityTest compares PluginSettings' defaults with the plugin's own test config, which stays
// in shortest-path/src/test/java (no changes to the plugin build).
def shortestPathProjectDir = gradle.ext.shortestPathProjectDir

compileTestJava.source fileTree(
    dir: new File(shortestPathProjectDir, 'src/test/java'),
    includes: [
        'shortestpath/TestShortestPathConfig.java',
    ]
)

apply from: 'gradle/dashboards.gradle'
apply from: 'gradle/benchmarks.gradle'
apply from: 'gradle/cache-dumpers.gradle'
apply from: 'gradle/routing-cuts.gradle'
