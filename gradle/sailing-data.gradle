// --- Sailing data ---
//
// Writes the plugin's sailing data from its collision map and moorings: the collision map's sailing layer
// (sailing/tiles and sailing/index: the sea and each boat kind's bodies of water; sailing/graph-<KIND>: each kind's sea
// graph).
//
// Usage:
//   ./gradlew sailingData -PshortestPathDir=../shortest-path [-PsailingDataResources=<resources dir>]
//
// Writes into the plugin checkout's src/main/resources by default. Run it whenever the collision map, the moorings
// or the plugin's sailing rules change, and before routingCuts, whose fingerprint covers the whole collision map.
// The plugin's SailingDataTest fails while the committed data is stale. The upstream ExtractCollisionMap
// workflow runs it after dumping a new collision map.
def sailingDataResources = providers.gradleProperty('sailingDataResources')
        .orElse(new File(gradle.ext.shortestPathProjectDir, 'src/main/resources').absolutePath)

tasks.register('sailingData', JavaExec) {
    group = 'routing'
    description = 'Writes the sailing layer into the plugin checkout. ' +
            'Optional: -PsailingDataResources=<resources dir>.'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'shortestpath.sailingdata.SailingDataGenerator'
    outputs.upToDateWhen { false }
    maxHeapSize = '4g'
    doFirst {
        args = [file(sailingDataResources.get()).absolutePath]
    }
}
