// --- Dashboards ---

def dashboardOutputRoot = layout.buildDirectory.dir('reports/pathfinder-dashboard')
// A committed suite (shortestpath.scenarios.Suites), or a data-only scenario CSV file to run instead.
def dashboardSuite = providers.gradleProperty('dashboardSuite')
        .orElse('routes')
def dashboardDataset = providers.gradleProperty('dashboardDataset')
        .orElse('')
// legacy or exact pathfinder (exact runs unprofiled).
def dashboardBackend = providers.gradleProperty('dashboardBackend')
        .orElse('legacy')
// Run only the scenarios tagged with this tier (the canonical suite's smoke/standard/full).
def dashboardTier = providers.gradleProperty('dashboardTier')
        .orElse('')
// Run only the scenarios whose name or category contains this text (ignoring case).
def dashboardFilter = providers.gradleProperty('dashboardFilter')
        .orElse('')
def dashboardSubtitle = providers.gradleProperty('dashboardSubtitle')
        .orElse('')
// Empty when not set: the test then auto-decides profiling by dataset size.
def dashboardProfile = providers.gradleProperty('dashboardProfile')
        .orElse('')
def dashboardHeatmap = providers.gradleProperty('dashboardHeatmap')
        .orElse('true')
def dashboardSeasonal = providers.gradleProperty('dashboardSeasonal')
        .orElse('false')
def dashboardF2p = providers.gradleProperty('dashboardF2p')
        .orElse('false')
def dashboardThreads = providers.gradleProperty('dashboardThreads')
        .orElse('')
// Derive bundle name and title from the suite (or file) name + profile flag.
// e.g. suite=clue-locations-full, profile=true
//   → bundle: clue-locations-full-profiled, title: Clue Locations Full Profiled
// Override with -PdashboardBundle=... or -PdashboardTitle=...
def source = (dashboardDataset.get().isEmpty() ? dashboardSuite.get() : dashboardDataset.get()) +
        (dashboardTier.get().isEmpty() ? '' : '_' + dashboardTier.get())
def filename = source.tokenize('/').last()
def stem = filename.contains('.') ? filename.substring(0, filename.lastIndexOf('.')) : filename
def slug = stem.replace('_', '-').toLowerCase()
def profiled = dashboardProfile.get() == 'true'
def backendSlug = dashboardBackend.get().equalsIgnoreCase('LEGACY')
        ? '' : '-' + dashboardBackend.get().toLowerCase()
def dashboardBundle = providers.gradleProperty('dashboardBundle')
        .orElse(profiled ? "${slug}${backendSlug}-profiled" : "${slug}${backendSlug}")
def dashboardTitle = providers.gradleProperty('dashboardTitle')
        .orElse(stem.tokenize('_-').collect { it.capitalize() }.join(' ')
                + (backendSlug.isEmpty() ? '' : ' ' + dashboardBackend.get().toLowerCase().capitalize())
                + (profiled ? ' Profiled' : ''))

def logDashboardLocation = { String taskName ->
    logger.lifecycle("")
    logger.lifecycle("${taskName} dashboard written.")
    logger.lifecycle("Serve it locally with:")
    logger.lifecycle("  python -m http.server --directory ${dashboardOutputRoot.get().asFile.absolutePath} 8000")
    logger.lifecycle("Then open: http://localhost:8000")
}

tasks.register('dashboard', Test) {
    doNotTrackState('Dashboard always re-runs to pick up the latest dataset and config.')
    group = 'verification'
    description = 'Builds the pathfinder dashboard from DashboardTest scenarios. ' +
            'Options (all via -P): dashboardSuite (default: routes; see shortestpath.scenarios.Suites), ' +
            'dashboardDataset (a route JSON file to run instead of a suite), ' +
            'dashboardFilter (run only scenarios whose name or category contains it), ' +
            'dashboardTier (run only scenarios with this tier tag, e.g. smoke), ' +
            'dashboardBackend (legacy or exact; default legacy), ' +
            'dashboardBundle, dashboardTitle, dashboardSubtitle, dashboardProfile ' +
            '(default: auto — on for datasets up to 200 scenarios, off above; ' +
            'pass true/false to force), ' +
            'dashboardHeatmap (default: true; only applies when profiling is on — ' +
            'set false to skip the per-tile visit map that dominates profiling ' +
            'memory on big datasets), ' +
            'dashboardSeasonal (default: false; tags the bundle so the frontend renders the ' +
            'Demonic Pacts League regions overlay), ' +
            'dashboardF2p (default: false; tags the bundle so the frontend tints members-only chunks), ' +
            'dashboardThreads (parallel scenario workers, default: availableProcessors()-3).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnit()
    include 'shortestpath/dashboard/DashboardTest.class'
    ignoreFailures = true
    reports {
        junitXml.required = false
        html.required = false
    }
    jvmArgs = ['-Xms1g', '-Xmx8g']
    testLogging.showStandardStreams = true
    systemProperty 'dashboard.outputRoot', dashboardOutputRoot.get().asFile.absolutePath
    systemProperty 'dashboard.bundleName', dashboardBundle.get()
    systemProperty 'dashboard.suite', dashboardSuite.get()
    systemProperty 'dashboard.backend', dashboardBackend.get()
    if (!dashboardDataset.get().isEmpty()) {
        systemProperty 'dashboard.dataset', file(dashboardDataset.get()).absolutePath
    }
    if (!dashboardFilter.get().isEmpty()) {
        systemProperty 'dashboard.filter', dashboardFilter.get()
    }
    if (!dashboardTier.get().isEmpty()) {
        systemProperty 'dashboard.tier', dashboardTier.get()
    }
    systemProperty 'benchmark.corpusDir', rootProject.file('corpus').absolutePath
    if (!dashboardProfile.get().isEmpty()) {
        systemProperty 'dashboard.profile', dashboardProfile.get()
    }
    systemProperty 'dashboard.heatmap', dashboardHeatmap.get()
    systemProperty 'dashboard.seasonal', dashboardSeasonal.get()
    systemProperty 'dashboard.f2p', dashboardF2p.get()
    if (!dashboardTitle.get().isEmpty()) {
        systemProperty 'dashboard.title', dashboardTitle.get()
    }
    if (!dashboardSubtitle.get().isEmpty()) {
        systemProperty 'dashboard.subtitle', dashboardSubtitle.get()
    }
    if (!dashboardThreads.get().isEmpty()) {
        systemProperty 'dashboard.threads', dashboardThreads.get()
    }
    doLast { logDashboardLocation('dashboard') }
}

