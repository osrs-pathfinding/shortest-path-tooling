// Prints every suite's scenarios as JSON; maintenance.py and import_issues.py read suites from it.
tasks.register('scenarioIndex', JavaExec) {
    group = 'help'
    description = 'Prints the scenario index: {suite: [{name, category, profile, tiers, description}]}.'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'shortestpath.scenarios.Suites'
    systemProperty 'benchmark.corpusDir', rootProject.file('corpus').absolutePath
}
