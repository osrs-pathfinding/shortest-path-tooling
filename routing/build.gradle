plugins {
    id 'java-library'
}

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex("net\\.runelite.*")
        }
    }
    mavenCentral()
}

// Headless route planning for an account: profiles, plugin settings, the pathfinder config, and the
// route API contract (corpus/schemas) that the route service serves. Tooling tests and the service
// both build on it, so they plan routes the same way.
dependencies {
    api 'shortestpath:shortest-path'
    api project(':accounts')
    // The plugin declares the RuneLite client compileOnly; headless consumers need it at runtime.
    api group: 'net.runelite', name: 'client', version: runeLiteVersion
    api 'com.fasterxml.jackson.core:jackson-annotations:2.17.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.3'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

test {
    jvmArgs = ['-Xms512m', '-Xmx4g']
    systemProperty 'corpus.dir', rootProject.file('corpus').absolutePath
}
